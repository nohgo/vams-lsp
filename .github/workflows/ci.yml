name: AMS language server
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim: ['v0.11.5', 'v0.12.5']
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HOME: ${{ github.workspace }}/build/cargo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - run: make check test test-protocol
      - name: Install pinned Neovim
        env:
          NVIM_VERSION: ${{ matrix.neovim }}
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            if [ "$(uname -m)" = arm64 ]; then name=nvim-macos-arm64; else name=nvim-macos-x86_64; fi
          else
            name=nvim-linux-x86_64
          fi
          curl -fL "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/$name.tar.gz" -o /tmp/nvim.tar.gz
          tar xzf /tmp/nvim.tar.gz -C /tmp
          echo "/tmp/$name/bin" >> "$GITHUB_PATH"
      - name: Native editor and ecosystem checks
        run: |
          sh scripts/fetch-test-deps.sh
          make test-neovim
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
