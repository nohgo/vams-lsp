[package]
name = "vams-lsp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Offline Verilog-A and Verilog-AMS language server"
license = "MIT"
repository = "https://github.com/nohgo/vams-lsp"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/docs/**", "/contrib/**", "/schema/**"]

[dependencies]
tower-lsp = "=0.20.0"
tower = "=0.4.13"
tokio = { version = "1", features = ["macros", "io-std", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.4.1"
ignore = "=0.4.23"
globset = "=0.4.15"
tree-sitter = "=0.26.13"
tree-sitter-language = "=0.1.2"
tree-sitter-verilog-ams = { git = "https://github.com/nohgo/tree-sitter-verilog-ams.git", rev = "0b2672e76ff2941fb62081b5d42b0ae84a0f6c46" }

[dev-dependencies]
tempfile = "=3.14.0"

[profile.release]
lto = "thin"
strip = true
